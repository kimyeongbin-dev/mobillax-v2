# ----------------------------------------
# \uC791\uC131\uC790: \uAE40\uC601\uBE48
# \uB9C8\uC9C0\uB9C9 \uC218\uC815\uC77C: 2025-05-11
# ----------------------------------------

# ----------------------------------------
# \uD83C\uDF31 Spring \uAE30\uBCF8 \uC124\uC815
# ----------------------------------------
spring.profiles.active=${SPRING_PROFILES_ACTIVE}
server.port=${SERVER_PORT}

# ----------------------------------------
# \uD83D\uDC2C MySQL \uB370\uC774\uD130\uBCA0\uC774\uC2A4 \uC5F0\uACB0 \uC124\uC815
# ----------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ----------------------------------------
# \uD83D\uDCDC \uB85C\uADF8 \uB808\uBCA8 \uC124\uC815
# ----------------------------------------
logging.level.root=${LOGGING_LEVEL_ROOT}
logging.level.com.example=${LOGGING_LEVEL_COM_EXAMPLE}
# \uBCF4\uC548 \uADDC\uCE59 S6: \uC694\uCCAD\u00B7\uD1A0\uD070\u00B7SQL \uAC12\uC774 \uB0A8\uB294 \uB85C\uAC70\uB294 \uB8E8\uD2B8 \uC218\uC900\uACFC \uC0C1\uAD00\uC5C6\uC774 INFO \uB85C \uACE0\uC815 (LoggingRulesTests)
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web.client=INFO
logging.level.org.springframework.web.reactive.function.client=INFO
logging.level.reactor.netty.http.client=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO
# \uB85C\uADF8 \uBA54\uC2DC\uC9C0 \uC18D API \uD0A4\u00B7\uC2DC\uD06C\uB9BF \uB9C8\uC2A4\uD0B9 (serviceKey=****, appKey: ****, PortOne ****)
logging.pattern.console=%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %replace(%replace(%m){'(?i)(serviceKey|appKey|confmKey|api[_-]?key|secret|password)("?\\s*[=:]\\s*"?)[^&\\s",]+', '$1$2****'}){'(?i)((PortOne|KakaoAK)\\s+)[A-Za-z0-9._=+/-]+', '$1****'}%n%wEx

# ----------------------------------------
# \uD83D\uDD52 Jackson \uC2DC\uAC04\uB300 \uC124\uC815
# ----------------------------------------
spring.jackson.time-zone=${SPRING_JACKSON_TIME_ZONE}

# ----------------------------------------
# \uD83E\uDDEC JPA \uC124\uC815
# ----------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
# SQL \uC740 \uCF58\uC194\uC5D0 \uCC0D\uC9C0 \uC54A\uB294\uB2E4 (S6). \uB85C\uCEEC\uC5D0\uC11C SQL \uBB38\uB9CC \uBCF4\uB824\uBA74 sqldebug \uD504\uB85C\uD544 (\uBC14\uC778\uB4DC \uAC12\uC740 \uADF8\uB798\uB3C4 \uB0A8\uAE30\uC9C0 \uC54A\uC74C)
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ----------------------------------------
# \uD83C\uDF10 UTF-8 \uC778\uCF54\uB529 \uC124\uC815
# ----------------------------------------
spring.http.encoding.charset=${SPRING_HTTP_ENCODING_CHARSET}
spring.http.encoding.enabled=${SPRING_HTTP_ENCODING_ENABLED}
spring.http.encoding.force=${SPRING_HTTP_ENCODING_FORCE}

# ----------------------------------------
# \uD83D\uDCC4 Thymeleaf \uC124\uC815
# ----------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ----------------------------------------
# \uD83D\uDD10 Spring Security \uAE30\uBCF8 \uC0AC\uC6A9\uC790 \uC124\uC815 (\uC120\uD0DD \uC0AC\uD56D)
# ----------------------------------------
# spring.security.user.name=
# spring.security.user.password=

# ----------------------------------------
# \uD83D\uDE8D \uC2DC\uC678\uBC84\uC2A4 API \uC124\uC815
# ----------------------------------------
bus.api.key=${BUS_API_KEY}
bus.api.url.ctycode=${BUS_API_URL_CTYCODE}
bus.api.url.terminal=${BUS_API_URL_TERMINAL}
bus.api.url.schedule=${BUS_API_URL_SCHEDULE}

# \uD544\uC218: GET \uD30C\uB77C\uBBF8\uD130\uC758 \uD55C\uAE00 \uAE68\uC9D0 \uBC29\uC9C0
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# portone api
portone_key=${PORTONE_APPKEY}
portone_store=${PORTONE_STORE_ID}
portone_channel_card=${PORTONE_CHANNEL_KEY}

# ----------------------------------------
# \uC624\uB958 \uC751\uB2F5: \uC608\uC678 \uBA54\uC2DC\uC9C0\u00B7\uC2A4\uD0DD\uD2B8\uB808\uC774\uC2A4\u00B7\uBC14\uC778\uB529 \uC624\uB958\uB97C \uC751\uB2F5\uC5D0 \uB123\uC9C0 \uC54A\uB294\uB2E4 (\uBCF4\uC548 \uADDC\uCE59 S5)
# ----------------------------------------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ----------------------------------------
# \uD5EC\uC2A4\uCCB4\uD06C (\uBCF4\uC548 \uADDC\uCE59 S7): \uC678\uBD80 API \uB294 \uC8FC\uAE30\uC801\uC73C\uB85C \uD655\uC778\uD574 \uACB0\uACFC\uB9CC \uBCF4\uAD00\uD55C\uB2E4
# ----------------------------------------
health.external.enabled=${HEALTH_EXTERNAL_ENABLED:true}
health.external.interval-ms=1800000
health.external.initial-delay-ms=15000
