<!DOCTYPE html>
<!-- 관리자 통계 (v2.13, 보안 규칙 S13): 날짜별 합계만 보인다 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MobilLax - 통계</title>
  <link th:href="@{/css/admin.css}" rel="stylesheet" type="text/css">
  <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>
<header th:replace="~{fragments/layout :: header('admin')}"></header>

<main class="admin">
  <nav th:replace="~{fragments/admin-nav :: nav('stats')}"></nav>
  <section class="admin-card">
    <h2>방문·이용 통계</h2>
    <p class="admin-tabs">
      <a th:each="r : ${ranges}" th:href="@{/admin/stats(range=${r})}" th:text="${r.label()}"
         th:classappend="${r == report.range()} ? 'active'">최근 7일</a>
    </p>
    <div class="admin-table-wrap">
      <table class="admin-table stats-table">
        <thead>
        <tr>
          <th>날짜</th><th>방문자</th><th>페이지 조회</th><th>경로 검색</th><th>주변 정보</th>
          <th>장바구니 담기</th><th>가입</th><th>결제 완료</th><th>결제 금액</th><th>문의</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="d : ${report.days()}">
          <td th:text="${#temporals.format(d.date(), 'yyyy-MM-dd')}"></td>
          <td th:text="${d.visitors()}"></td>
          <td th:text="${d.pageViews()}"></td>
          <td th:text="${d.routeSearches()}"></td>
          <td th:text="${d.nearbySearches()}"></td>
          <td th:text="${d.cartAdds()}"></td>
          <td th:text="${d.signups()}"></td>
          <td th:text="${d.payments()}"></td>
          <td th:text="${#numbers.formatInteger(d.paymentAmount(), 1, 'COMMA')} + '원'"></td>
          <td th:text="${d.inquiries()}"></td>
        </tr>
        </tbody>
        <tfoot th:with="t=${report.total()}">
        <tr>
          <th>합계</th>
          <td th:text="${t.visitors()}"></td>
          <td th:text="${t.pageViews()}"></td>
          <td th:text="${t.routeSearches()}"></td>
          <td th:text="${t.nearbySearches()}"></td>
          <td th:text="${t.cartAdds()}"></td>
          <td th:text="${t.signups()}"></td>
          <td th:text="${t.payments()}"></td>
          <td th:text="${#numbers.formatInteger(t.paymentAmount(), 1, 'COMMA')} + '원'"></td>
          <td th:text="${t.inquiries()}"></td>
        </tr>
        </tfoot>
      </table>
    </div>
    <ul class="stats-notes">
      <li>방문자는 하루 안에서 같은 사람을 한 번만 셉니다. 합계는 날마다 센 수를 더한 값이라 기간 전체의 순 방문자와 다릅니다.</li>
      <li>관리자 계정과 봇의 요청은 세지 않습니다. 앱을 다시 띄운 날은 방문자가 조금 많게 나올 수 있습니다.</li>
      <li>가입은 탈퇴하지 않고 남아 있는 계정만 셉니다. 경로 검색은 결과를 받은 요청만 셉니다.</li>
    </ul>
  </section>
</main>
</body>
</html>
