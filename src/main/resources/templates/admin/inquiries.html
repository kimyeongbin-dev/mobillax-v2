<!DOCTYPE html>
<!-- 관리자 1:1 문의 목록 (v2.12, 보안 규칙 S12): 문의한 사람은 계정 ID 로만 보인다 -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MobilLax - 1:1 문의 관리</title>
  <link th:href="@{/css/admin.css}" rel="stylesheet" type="text/css">
  <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>
<header th:replace="~{fragments/layout :: header('admin')}"></header>

<main class="admin">
  <nav th:replace="~{fragments/admin-nav :: nav('inquiries')}"></nav>
  <section class="admin-card">
    <h2>1:1 문의</h2>
    <p class="admin-tabs">
      <a th:each="s : ${statuses}" th:href="@{/admin/inquiries(status=${s})}" th:text="${s.label()}"
         th:classappend="${s == status} ? 'active'">답변 대기</a>
    </p>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>번호</th><th>종류</th><th>제목</th><th>계정 ID</th><th>받은 시각</th><th>답한 시각</th></tr></thead>
        <tbody>
        <tr th:each="q : ${inquiries.content}">
          <td th:text="${q.id}"></td>
          <td th:text="${q.category.label()}"></td>
          <td><a th:href="@{/admin/inquiries/{id}(id=${q.id})}" th:text="${q.title}"></a></td>
          <td th:text="${q.userId}"></td>
          <td th:text="${#temporals.format(q.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
          <td th:text="${q.answeredAt != null} ? ${#temporals.format(q.answeredAt, 'yyyy-MM-dd HH:mm')} : '-'"></td>
        </tr>
        </tbody>
      </table>
    </div>
    <p th:if="${inquiries.content.isEmpty()}" th:text="${status.label()} + ' 문의가 없습니다.'"></p>
    <p class="pager" th:if="${inquiries.totalPages > 1}">
      <a th:if="${inquiries.hasPrevious()}" th:href="@{/admin/inquiries(status=${status},page=${inquiries.number - 1})}">이전</a>
      <span th:text="${inquiries.number + 1} + ' / ' + ${inquiries.totalPages}"></span>
      <a th:if="${inquiries.hasNext()}" th:href="@{/admin/inquiries(status=${status},page=${inquiries.number + 1})}">다음</a>
    </p>
  </section>
</main>
</body>
</html>
