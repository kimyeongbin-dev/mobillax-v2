<!DOCTYPE html>
<!-- 관리자 요약 (v2.11): OTP 까지 확인한 관리자만 (SecurityConfig, 보안 규칙 S12) -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MobilLax - 관리자</title>
  <link th:href="@{/css/admin.css}" rel="stylesheet" type="text/css">
  <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>
<header th:replace="~{fragments/layout :: header('admin')}"></header>

<main class="admin">
  <nav th:replace="~{fragments/admin-nav :: nav('home')}"></nav>
  <p class="notice warning" th:if="${warning != null}" th:text="${warning}"></p>
  <section class="admin-card">
    <h2>요약</h2>
    <div class="summary-grid">
      <div>전체 계정<strong th:text="${summary.users()}">0</strong></div>
      <div>정지된 계정<strong th:text="${summary.suspended()}">0</strong></div>
      <div><a th:href="@{/admin/inquiries}">답변 대기 문의</a><strong th:text="${waitingInquiries}">0</strong></div>
      <div><a th:href="@{/admin/stats}">오늘 방문자</a><strong th:text="${today.visitors()}">0</strong></div>
      <div>오늘 경로 검색<strong th:text="${today.routeSearches()}">0</strong></div>
      <div>오늘 결제 완료<strong th:text="${today.payments()}">0</strong></div>
      <div>
        <a th:href="@{/admin/audit(month=${lastMonth})}" th:text="${lastMonth} + ' 감사 로그 점검'">지난달 감사 로그 점검</a>
        <strong th:text="${lastMonthReviewed} ? '완료' : '아직'">아직</strong>
      </div>
    </div>
    <p><small>관리자 세션은 10분 동안 아무것도 하지 않으면 끝납니다.</small></p>
  </section>
  <section class="admin-card">
    <h2>최근 관리자 활동</h2>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>시각</th><th>관리자</th><th>일</th><th>대상 ID</th></tr></thead>
        <tbody>
        <tr th:each="log : ${recentLogs}">
          <td th:text="${#temporals.format(log.createdAt, 'MM-dd HH:mm:ss')}"></td>
          <td th:text="${log.adminEmail}"></td>
          <td th:text="${log.action.label()}"></td>
          <td th:text="${log.targetUserId}"></td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
