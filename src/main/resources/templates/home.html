<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MobilLax</title>
  <link href="css/style.css" type="text/css" rel="stylesheet">
  <script th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoJsAppKey}&libraries=services|"></script>
  <th:block th:replace="~{fragments/layout :: head}"></th:block>
  <script src="javascript/transport.js"></script>
  <script src="javascript/itinerary.js"></script>
  <script src="javascript/script.js"></script>
</head>
<body>
<header th:replace="~{fragments/layout :: header('home')}"></header>

<main>
  <section class="search-card">
    <h2>빠른길찾기</h2>
    <div class="search-box">
      <div class="input-group">
        <i class="fas fa-location-arrow"></i>
        <input type="text" id="fromInput" placeholder="출발지 입력" autocomplete="off">
        <button aria-label="검색">
          <i class="fas fa-search"></i>
        </button>
      </div>
      <button type="button" class="switch-button" id="swapButton" aria-label="출발지와 도착지 바꾸기">⇄</button>
      <div class="input-group">
        <i class="fas fa-map-marker-alt"></i>
        <input type="text" id="toInput" placeholder="도착지 입력" autocomplete="off">
        <button><i class="fas fa-search"></i></button>
      </div>
    </div>
    <div class="depart-group">
      <label for="departInput"><i class="far fa-clock"></i> 출발 일시</label>
      <input type="datetime-local" id="departInput">
      <span class="depart-hint">비우면 지금 출발 · 예매는 당일 출발편만</span>
    </div>
    <div class="unified-suggest-box" id="suggestions">
      <div class="suggest-header">출발지 검색</div>
    </div>
    <div class="search-action">
      <button type="button" class="find-route-button" id="findRouteButton">길찾기</button>
    </div>
    <div class="mode-select">
      <div class="mode-item" data-mode="transit">
        <i class="fas fa-subway"></i><span>대중교통</span>
      </div>
      <a class="mode-item" data-mode="reservation" th:href="@{/mypage/payments}">
        <i class="fas fa-ticket-alt"></i><span>예매확인</span>
      </a>
      <a class="mode-item" data-mode="fare" th:href="@{/compare}">
        <i class="fas fa-receipt"></i><span>요금비교</span>
      </a>
      <a class="mode-item" data-mode="local" th:href="@{/nearby}" id="nearbyMenu">
        <i class="fas fa-map-marker-alt"></i><span>주변정보</span>
      </a>
    </div>
    <div class="related-links">
      관련
      <a href="https://search.naver.com/search.naver?sm=msv_nex&where=m&query=%EC%A7%80%ED%95%98%EC%B2%A0%EB%85%B8%EC%84%A0%EB%8F%84">지하철노선도</a>
      ·
      <a href="https://www.letskorail.com/" target="_blank" rel="noopener noreferrer" title="코레일 승차권 예매 (새 창)">기차승차권예매</a>
    </div>
  </section>
</main>
<form id="routeForm">
  <fieldset>
    <legend>추천 경로</legend>
    <ul class="route-list" id="routeList"></ul>
  </fieldset>
</form>
<footer>
  <div>
    © 2025 MobilLax. All rights reserved.
  </div>
</footer>
</body>
</html>
