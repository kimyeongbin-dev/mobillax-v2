<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MobilLax - 상세 경로</title>
  <link href="/css/route.css" type="text/css" rel="stylesheet"></link>
  <!-- 지도는 카카오맵: 브라우저용 JavaScript 키(등록 도메인에서만 동작). TMAP 키는 서버 전용 (보안 규칙 S9) -->
  <script th:src="|https://dapi.kakao.com/v2/maps/sdk.js?appkey=${kakaoJsAppKey}|"></script>
  <th:block th:replace="~{fragments/layout :: head}"></th:block>
  <script src="/javascript/transport.js"></script>
  <script src="/javascript/cart.js"></script>
  <script src="/javascript/route.js"></script>
  <script src="/javascript/payment.js"></script>
  <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="back-home">
        <a href="/home" title="홈으로"><i class="fas fa-arrow-left"></i> 되돌아가기</a>
      </div>
      <nav th:replace="~{fragments/layout :: compactNav}"></nav>
      <h2 id="routeTitle">상세경로 안내</h2>
      <div class="summary-box"></div>
    </div>
    <div class="sidebar-content"></div>
    <div class="sidebar-footer">
      <th:block th:if="${@layout.loggedIn()}">
        <button class="btn-cart">
          <i class="fas fa-shopping-cart"></i> 장바구니 담기
        </button>
        <button class="btn-direct-pay find-route-button">
          <i class="fas fa-credit-card"></i> 결제하기
        </button>
      </th:block>
      <!-- 비로그인: 조회는 되고, 예매는 로그인 뒤 이 화면으로 돌아와서 (v2.9) -->
      <a th:unless="${@layout.loggedIn()}" th:href="@{/login}" data-login-next class="btn-login-to-book">
        <i class="fas fa-sign-in-alt"></i> 로그인하고 예매하기
      </a>
    </div>
  </div>
  <div id="noRoutePopup" class="cart-popup hidden">
    <h3>경로를 선택해주세요</h3>
    <div class="popup-buttons">
      <button type="button" class="btn-yes" data-popup-close>확인</button>
    </div>
  </div>

  <!-- 장바구니 담기 완료 -->
  <div id="cartPopup" class="cart-popup hidden">
    <h3>🛒 장바구니에 담겼습니다</h3>
    <p>장바구니로 이동하시겠습니까?</p>
    <div class="popup-buttons">
      <a class="btn-yes" th:href="@{/cart}">예</a>
      <button type="button" class="btn-no" data-popup-close>아니오</button>
    </div>
  </div>
  <div class="map-area">
    <div id="map_div"></div>
  </div>
</body>
</html>
