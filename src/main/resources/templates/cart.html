<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobilLax - 장바구니</title>
    <link href="css/cart.css" type="text/css" rel="stylesheet">
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <script src="/javascript/transport.js"></script>
    <script src="/javascript/cart.js"></script>
    <script src="/javascript/payment.js"></script>
    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
</head>
<body>
<header th:replace="~{fragments/layout :: header('cart')}"></header>

<main>
    <section class="search-card flat cart-page">
        <h2><i class="fas fa-shopping-cart"></i> 장바구니</h2>
        <p class="cart-guide">결제할 경로 묶음을 고르세요. 결제창은 교통수단마다 한 번씩 열립니다.</p>

        <div class="cart-toolbar" hidden>
            <label class="select-all"><input type="checkbox" id="selectAll"> 결제할 수 있는 묶음 전체 선택</label>
            <button type="button" id="clearCartBtn" class="text-button danger">전체 비우기</button>
        </div>

        <div class="cart-list"></div>

        <div class="cart-paybar" hidden>
            <div class="paybar-summary">
                <span id="selectedCount">선택한 묶음 없음</span>
                <strong id="selectedTotal">0원</strong>
                <span id="selectedWindows" class="paybar-windows"></span>
            </div>
            <button type="button" class="btn-cart-pay find-route-button" disabled>선택 결제</button>
        </div>
    </section>
</main>

<footer>
    <div>© 2025 MobilLax. All rights reserved.</div>
</footer>

</body>
</html>
