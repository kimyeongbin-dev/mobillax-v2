<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MobilLax - 장바구니</title>
    <link href="css/cart.css" type="text/css" rel="stylesheet">
    <th:block th:replace="~{fragments/layout :: head}"></th:block>
    <script src="/javascript/transport.js"></script>
    <script src="/javascript/cart.js"></script>
    <script src="/javascript/payment.js"></script>
    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
</head>
<body>
<header th:replace="~{fragments/layout :: header('cart')}"></header>

<main>
    <section class="search-card flat">
        <h2><i class="fas fa-shopping-cart"></i> 장바구니</h2>
        <div class="cart-list"></div>

        <div class="cart-actions" style="text-align: right; margin-top: 20px;">
            <!-- 장바구니 전체 결제 버튼 -->
            <button class="btn-cart-pay find-route-button">전체 결제하기</button>

            <!-- 장바구니 전체 비우기 버튼 -->
            <button id="clearCartBtn" class="find-route-button danger">전체 비우기</button>
        </div>
    </section>
</main>

<footer>
    <div>© 2025 MobilLax. All rights reserved.</div>
</footer>

</body>
</html>
