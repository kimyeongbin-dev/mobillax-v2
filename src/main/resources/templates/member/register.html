<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MobilLax - 회원가입</title>
  <link href="/css/login.css" type="text/css" rel="stylesheet">
  <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>
<div class="form-wrapper">
  <div class="form-box">
    <h2>회원가입</h2>

    <!-- 오류 메시지 출력 -->
    <div th:if="${error != null}">
      <p style="color: red;" th:text="${error}"></p>
    </div>

    <!-- 성공 메시지 출력 -->
    <p th:if="${successMessage != null}" class="success-message" style="color: #1a7f37;" th:text="${successMessage}"></p>

    <!-- 회원가입 폼 -->
    <form action="/register" method="POST" accept-charset="UTF-8">
      <!-- CSRF 토큰 필드 추가 -->
      <th:block th:if="${_csrf != null}">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
      </th:block>

      <input type="text" name="name" placeholder="이름" required maxlength="30" class="form-input">
      <input type="email" name="email" placeholder="이메일" required maxlength="100" class="form-input">
      <!-- 입력 제한은 안내용이고, 실제 검사는 서버가 한다 (S10) -->
      <input type="password" name="password" placeholder="비밀번호 (8-64자)" required minlength="8" maxlength="64" class="form-input">
      <button type="submit" class="form-btn">회원가입</button>
    </form>

    <div class="link">이미 계정이 있으신가요? <a href="/login">로그인</a></div>
  </div>
</div>
</body>
</html>
