<!DOCTYPE html>
<!-- 1:1 문의 내역 (v2.12): 본인 문의만 (보안 규칙 S4). 모든 값은 th:text 로 이스케이프한다 (S10) -->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MobilLax - 1:1 문의</title>
  <link th:href="@{/css/mypage.css}" rel="stylesheet" type="text/css">
  <link th:href="@{/css/inquiry.css}" rel="stylesheet" type="text/css">
  <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>
<header th:replace="~{fragments/layout :: header('mypage')}"></header>

<main>
  <section class="mypage-container">
    <div class="inquiry-head">
      <h2>1:1 문의</h2>
      <a th:href="@{/mypage/inquiries/new}" class="inquiry-button">문의하기</a>
    </div>
    <p class="history-help">답변은 이 화면에서만 확인할 수 있습니다. 이메일로 보내지 않습니다.</p>

    <p class="history-empty" th:if="${#lists.isEmpty(inquiries)}">아직 남긴 문의가 없습니다.</p>

    <ul class="inquiry-list" th:unless="${#lists.isEmpty(inquiries)}">
      <li th:each="q : ${inquiries}" th:classappend="${q.answered()} ? 'answered'">
        <a th:href="@{/mypage/inquiries/{id}(id=${q.id})}">
          <span class="inquiry-category" th:text="${q.category.label()}">예매·결제</span>
          <strong th:text="${q.title}">제목</strong>
          <span class="inquiry-status" th:text="${q.status.label()}">답변 대기</span>
          <span class="badge-new" th:if="${q.newAnswer()}">새 답변</span>
          <small th:text="${#temporals.format(q.createdAt, 'yyyy.MM.dd HH:mm')}">2026.10.21 10:00</small>
        </a>
      </li>
    </ul>
    <p><a th:href="@{/mypage}" class="cancel-button">← 마이페이지</a></p>
  </section>
</main>

<footer>
  <div>© 2025 MobilLax. All rights reserved.</div>
</footer>
</body>
</html>
