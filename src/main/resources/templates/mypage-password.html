<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MobilLax - 비밀번호 변경</title>
  <link th:href="@{/css/mypage.css}" rel="stylesheet" type="text/css">
  <th:block th:replace="~{fragments/layout :: head}"></th:block>
</head>
<body>
<header th:replace="~{fragments/layout :: header('mypage')}"></header>

<main>
  <section class="edit-profile-container">
    <h2>비밀번호 변경</h2>
    <p class="notice error" th:if="${error != null}" th:text="${error}"></p>
    <!-- 입력 제한은 안내용이고, 실제 검사는 서버가 한다 (보안 규칙 S10) -->
    <form th:action="@{/mypage/password}" method="post" accept-charset="UTF-8" autocomplete="off">
      <div class="form-group">
        <label for="currentPassword">현재 비밀번호</label>
        <input type="password" id="currentPassword" name="currentPassword" required maxlength="64"
               autocomplete="current-password">
      </div>
      <div class="form-group">
        <label for="newPassword">새 비밀번호 <small>(8-64자)</small></label>
        <input type="password" id="newPassword" name="newPassword" required minlength="8" maxlength="64"
               autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="newPasswordConfirm">새 비밀번호 확인</label>
        <input type="password" id="newPasswordConfirm" name="newPasswordConfirm" required minlength="8" maxlength="64"
               autocomplete="new-password">
      </div>
      <div class="form-buttons">
        <button type="submit">바꾸기</button>
        <a th:href="@{/mypage}" class="cancel-button">취소</a>
      </div>
    </form>
  </section>
</main>

<footer>
  <div>© 2025 MobilLax. All rights reserved.</div>
</footer>
</body>
</html>
