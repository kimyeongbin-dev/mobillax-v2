<!DOCTYPE html>
<!--
  공통 레이아웃 조각 (v2.5) — 모든 화면이 이 조각을 쓴다 (scripts/web-layout.test.js 가 검사)

  head            : 공통 CSS·아이콘, 세션 만료 시간(meta), 공통 스크립트(csrf.js → safe-html.js → session-timer.js)
                    화면 스크립트보다 먼저 넣는다
  header(active)  : 상단 메뉴. 로그인했으면 경로 검색·장바구니(묶음 수)·예매 내역·마이페이지·로그아웃·세션 타이머
                    active: home | cart | payments | mypage | (빈 문자열)
  compactNav      : 헤더가 없는 화면(지도 화면)용 작은 메뉴와 세션 타이머

  값은 LayoutInfo(@layout) 가 화면을 그릴 때만 계산한다
-->
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:fragment="head">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <meta th:if="${@layout.loggedIn()}" name="session-timeout" th:content="${@layout.sessionTimeoutSeconds()}">
    <script th:src="@{/javascript/csrf.js}"></script>
    <script th:src="@{/javascript/safe-html.js}"></script>
    <script th:src="@{/javascript/session-timer.js}" defer></script>
  </th:block>
</head>
<body>

<header class="site-header" th:fragment="header(active)">
  <h1><a th:href="@{/home}" title="MobilLax 홈">MobilLax</a></h1>
  <nav class="site-nav" aria-label="주 메뉴">
    <th:block th:if="${@layout.loggedIn()}" th:with="cartCount=${@layout.cartCount()}">
      <span class="session-timer" data-session-timer>
        <span data-remaining>로그인 유지</span>
        <button type="button" data-extend title="로그인 시간을 다시 늘립니다">연장</button>
      </span>
      <a th:href="@{/home}" th:classappend="${active == 'home'} ? 'active'"><i class="fas fa-route"></i>경로 검색</a>
      <a th:href="@{/cart}" th:classappend="${active == 'cart'} ? 'active'">
        <i class="fas fa-shopping-cart"></i>장바구니
        <span class="nav-badge" th:if="${cartCount > 0}" th:text="${cartCount}">0</span>
      </a>
      <a th:href="@{/mypage/payments}" th:classappend="${active == 'payments'} ? 'active'"><i class="fas fa-ticket-alt"></i>예매 내역</a>
      <a th:href="@{/mypage}" th:classappend="${active == 'mypage'} ? 'active'"><i class="fas fa-user"></i>마이페이지</a>
      <form th:action="@{/logout}" method="post" class="logout-form">
        <button type="submit" class="logout-button"><i class="fas fa-sign-out-alt"></i>로그아웃</button>
      </form>
    </th:block>
    <th:block th:unless="${@layout.loggedIn()}">
      <a th:href="@{/login}"><i class="fas fa-sign-in-alt"></i>로그인</a>
      <a th:href="@{/register}"><i class="fas fa-user-plus"></i>회원가입</a>
    </th:block>
  </nav>
</header>

<nav class="compact-nav" th:fragment="compactNav" aria-label="빠른 메뉴">
  <th:block th:if="${@layout.loggedIn()}" th:with="cartCount=${@layout.cartCount()}">
    <span class="session-timer" data-session-timer>
      <span data-remaining>로그인 유지</span>
      <button type="button" data-extend title="로그인 시간을 다시 늘립니다">연장</button>
    </span>
    <a th:href="@{/cart}"><i class="fas fa-shopping-cart"></i> 장바구니<span th:if="${cartCount > 0}" th:text="' (' + ${cartCount} + ')'"></span></a>
    <a th:href="@{/mypage/payments}"><i class="fas fa-ticket-alt"></i> 예매 내역</a>
    <a th:href="@{/mypage}"><i class="fas fa-user"></i> 마이페이지</a>
  </th:block>
</nav>

</body>
</html>
