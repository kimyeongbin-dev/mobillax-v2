plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.5'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'MobilLax'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// ✅ Lombok
	implementation 'org.projectlombok:lombok:1.18.30'
	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	// ✅ Spring Boot 기본 스타터
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// 입력값 검증 (보안 규칙 S10): 요청 DTO 에 제약을 걸고 @Valid 로 검사
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web-services'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

	// ✅ Thymeleaf + Spring Security 연동 (추가!)
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

	// ✅ WebClient만 사용
	implementation 'org.springframework:spring-webflux'

	// ✅ DB 드라이버
	implementation 'mysql:mysql-connector-java:8.0.33'

	// ✅ .env
	implementation 'me.paulschwarz:spring-dotenv:4.0.0'

	// ✅ JSON & XML
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml'

	// ✅ ConfigurationProperties 지원
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	// 관리자 OTP 등록용 QR 코드 (v2.11): 외부 QR 서비스에 비밀값을 보내지 않고 서버에서 그린다
	implementation 'com.google.zxing:core:3.5.3'

	// ✅ Swagger / OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

	// ✅ 테스트 및 개발 도구
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

tasks.named('test') {
	useJUnitPlatform()
	// 테스트 중에는 헬스체크의 외부 API 주기 점검을 끈다 (실제 키로 외부 호출·한도 소모를 하지 않도록)
	systemProperty 'health.external.enabled', 'false'
	// 관리자 지정(ADMIN_EMAIL)은 앱이 뜰 때 DB 를 바꾸므로 테스트에서는 끈다 (관리자 테스트가 직접 만든다)
	systemProperty 'admin.bootstrap.enabled', 'false'
	// OTP 비밀값 암호화 키: 테스트마다 새로 만든다 (.env 의 실제 키를 쓰지 않고, 저장소에 키 모양 문자열을 남기지 않음)
	systemProperty 'admin.otp-key', { def bytes = new byte[32]; new java.security.SecureRandom().nextBytes(bytes); java.util.Base64.encoder.encodeToString(bytes) }()
	// 실패 원인(assert 메시지)을 콘솔에 그대로 보여 준다 (Docker 로 돌리면 리포트 파일을 보기 어렵다)
	testLogging {
		events 'failed'
		exceptionFormat 'full'
	}
}

tasks.withType(JavaCompile) {
	options.incremental = true
	options.encoding = 'UTF-8'
}
springBoot {
	mainClass = 'MobilLax.MobilLaxApplication'
}