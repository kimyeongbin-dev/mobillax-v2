# 로컬 실행: docker compose up -d --build
# 테스트:    docker compose --profile test run --rm --build test
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

  # 테스트 실행용 (평소에는 뜨지 않음): docker compose --profile test run --rm test
  test:
    profiles: ["test"]
    build:
      context: .
      target: build
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    command: ["./gradlew", "test", "--no-daemon"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
